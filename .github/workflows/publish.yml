name: publish.yml

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm i -g rollup
      - run: npm run rollup src/index.js -o build/index.cjs -f cjs
      - run: npm run rollup src/index.js -o build/index.mjs -f esm
      - run: cp ./src/index.d.ts ./build
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish